<title>통역일지</title>
<style>
:root{color-scheme:light;--ink:#172847;--muted:#55657e;--line:#dbe2ed;--bg:#f3f5f9;--paper:#fff;--blue:#184bad;--pale:#e9effd;--green:#11634d;--amber:#fff3d9;--amber-ink:#674207;--red:#a02424}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:8px 13px;min-height:44px;background:#fff;font-weight:650}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.ghost{background:transparent;border-color:transparent;color:var(--blue)}
button.danger{color:var(--red)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid #3e76df;outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:#152e5d;color:#fff}
.bar{max-width:1180px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:56px}
.bar h1{font-size:19px;margin:0;flex:1;letter-spacing:-.03em}
.bar button{background:transparent;color:#fff;border-color:#ffffff55;min-height:40px;padding:6px 11px;font-size:14px}
.sync{font-size:13px;color:#cfe0ff;white-space:nowrap}
.sync.warn{color:#ffd98a}
main{max-width:1180px;margin:auto;padding:12px}
.layout{display:grid;gap:14px}
@media(min-width:900px){.layout.split{grid-template-columns:minmax(300px,380px) 1fr;align-items:start}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h2{font-size:19px;margin:0 0 8px;letter-spacing:-.03em}
.panel h3{font-size:16px;margin:18px 0 8px}
.muted{color:var(--muted);font-size:14px}
.note{background:var(--amber);color:var(--amber-ink);border-radius:10px;padding:9px 12px;font-size:14px;margin:8px 0}
.okbox{background:#e2f4ec;color:var(--green);border-radius:10px;padding:9px 12px;font-size:14px;margin:8px 0}
.big{width:100%;font-size:18px;min-height:54px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}

ul.list{list-style:none;margin:0;padding:0}ul.list li+li{margin-top:8px}
.item{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 12px}
.item[aria-current=true]{border-color:var(--blue);background:var(--pale)}

.chip{font-size:12px;border-radius:20px;background:#eef1f6;color:#364661;padding:2px 8px;white-space:nowrap;font-weight:700;align-self:start}
.chip.ready{background:#e6eefc;color:#194486}.chip.done{background:#def4e9;color:var(--green)}.chip.warn{background:var(--amber);color:var(--amber-ink)}
.empty{padding:22px 12px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}
label.f{display:block;font-weight:700;font-size:14px;margin-top:12px}
.f input,.f textarea,.f select,input.f{display:block;width:100%;margin-top:5px;padding:10px;min-height:46px;border:1px solid #c5d0e1;border-radius:10px;background:#fff;font-size:16px}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.time{display:flex;gap:6px;margin-top:5px}.time input{flex:1;min-width:0;margin:0!important}.time button{padding:6px 10px;font-size:14px}
fieldset{border:0;padding:0;margin:14px 0 0;min-width:0}legend{font-weight:700;font-size:14px;padding:0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}

.chips button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}

legend.req::after{content:" *";color:var(--red)}
.calc{font-size:14px;color:var(--muted);margin-top:6px}
.counter{font-size:13px;color:var(--muted);text-align:right}.counter.over{color:var(--red);font-weight:700}
.sticky-top{position:sticky;top:56px;z-index:4;margin:-4px 0 10px}
.missing{display:block;width:100%;text-align:left;background:var(--amber);color:var(--amber-ink);border-color:#f0d49a;font-size:14px}

.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.bottom{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 calc(8px + env(safe-area-inset-bottom));z-index:3}
dl.copy{margin:10px 0 0}dl.copy>div{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
dl.copy dt{font-size:14px;color:var(--muted);font-weight:700}dl.copy dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
dl.copy button{min-height:36px;padding:4px 10px;font-size:13px}
@media(max-width:560px){dl.copy>div{grid-template-columns:1fr auto}dl.copy dt{grid-column:1/-1}}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}.steps>li{counter-increment:s;position:relative;padding:6px 0 10px 38px}

.bm{display:inline-block;padding:9px 14px;border-radius:10px;background:#fff7d6;border:2px dashed #d39b19;color:#5b3d00;font-weight:800;text-decoration:none;cursor:grab}

.toast:empty{display:none}
.diff{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}

[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<body>
<header><div class="bar"><h1 id="title">통역일지</h1><span class="sync" id="sync" role="status" aria-live="polite"></span><button type="button" id="admin-btn" hidden>관리</button><button type="button" id="settings-btn" hidden>설정</button></div></header>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const FORM_URL = "http://www.kbdeaf.or.kr/trans_admin/trans_form.php?doc_type=R&sel_grp_code=";
const STORE_KEY = "ksl-journal-v3";
const SCRIPT_URL = ((window.KSL_CONFIG || {}).scriptUrl || "").trim();
const OPT = {
  division:["출장","내방","전화"],
  request:["인터넷","문자","영상전화","전화","내방","기타"],
  targets:["농인","문맹농인","청인","기타"],
  method:["수어,음성통역","중계통역","기타"],
  area:["행사통역","법률통역","교육통역","의료통역","방송통역","관공서통역","일상생활통역","취업알선통역","기타"]
};
const FIELDS = ["interpreter","date","start","end","place","program","division","request","targets","method","area","client","content","result","pendingResult","deafNames","hearingNames"];
const LABEL = {interpreter:"수어통역사",date:"수어통역일",start:"시작 시각",end:"종료 시각",place:"수어통역장소",program:"프로그램명",division:"분류",request:"수어통역의뢰방법",targets:"수어통역대상",method:"수어통역방법",area:"수어통역영역",client:"의뢰인",content:"수어통역내용",result:"결과",pendingResult:"결과 미확정",deafNames:"참석인원(농인)",hearingNames:"참석인원(청인)",status:"상태"};
const STATUS = {draft:"작성 중",ready:"입력 대기",done:"입력 완료"};
const LIMIT = {place:40,result:200,interpreter:20,client:14};
const AREA_HINTS = [
  ["의료통역",/진료|검사|처방|복약|입원|퇴원|수술|치료|병원|치과|한의원|약국|보건소|의사|간호/],
  ["법률통역",/경찰|법원|검찰|조사|재판|변호|고소|소송|공증/],
  ["관공서통역",/주민센터|행정복지센터|시청|구청|군청|민원|세무서|고용센터|연금공단|건강보험|관공서/],
  ["교육통역",/학교|수업|강의|교육|연수|학원|세미나/],
  ["취업알선통역",/면접|취업|채용|구직|직업상담/],
  ["행사통역",/행사|기념식|대회|축제|총회|발대식/],
  ["방송통역",/방송|촬영|인터뷰|녹화/]
];

/* ---------- small utilities ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const nowIso = () => new Date().toISOString();
const rand = () => { try { const a = new Uint8Array(12); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2,"0")).join(""); } catch { return Math.random().toString(16).slice(2) + Date.now().toString(16); } };
const makeId = () => "r-" + Date.now().toString(36) + "-" + rand().slice(0,12);
const makeRev = () => Date.now().toString(36) + "-" + rand().slice(0,10);
const koreaDate = (d=new Date()) => new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
const koreaTime = (d=new Date()) => new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(d);
const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
const same = (a,b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
const wide = () => matchMedia("(min-width:900px)").matches;

function toMin(t){ const m=/^([01]\d|2[0-3]):([0-5]\d)$/.exec(t||""); return m ? +m[1]*60 + +m[2] : null; }
/* Same rule as the existing system: 새벽 0-7, 오전 7-12, 오후 12-18, 저녁 18-24; end earlier than start = next day. */
function timeInfo(r){
  const s = toMin(r.start), e = toMin(r.end);
  if (s === null || e === null || s === e) return null;
  const cuts=[0,420,720,1080,1440];
  const seg=(a,b)=>cuts.slice(0,4).map((c,i)=>Math.max(0,Math.min(b,cuts[i+1])-Math.max(a,c)));
  const overnight = e < s;
  const bands = overnight ? seg(s,1440).map((v,i)=>v+seg(0,e)[i]) : seg(s,e);
  return {total: overnight ? 1440-s+e : e-s, overnight, bands};
}
function weekday(date){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date||"")) return "";
  const d = new Date(date+"T00:00:00Z"); if (isNaN(d) || d.toISOString().slice(0,10)!==date) return "";
  return "일월화수목금토"[d.getUTCDay()];
}
function suggestArea(r){
  const text = [r.place,r.content,r.program].join(" ");
  for (const [area,re] of AREA_HINTS) if (re.test(text)) return area;
  return "";
}

/* ---------- record model ---------- */
function blankRecord(){
  return {id:makeId(), owner:S.settings.name, status:"draft", interpreter:S.settings.name, date:koreaDate(), start:"", end:"",
    place:"", program:"", division:"", request:"", targets:S.settings.defaultTargets === false ? [] : ["농인","청인"], method:S.settings.defaultMethod === false ? "" : "수어,음성통역", area:"",
    client:"", content:"", result:"", pendingResult:false, deafNames:"", hearingNames:"", needsCorrection:false,
    created:nowIso(), updated:nowIso(), rev:""};
}
function normalize(v){
  if (!v || typeof v !== "object" || typeof v.id !== "string" || !/^[A-Za-z0-9-]{5,80}$/.test(v.id)) return null;
  const r = blankRecordShape();
  for (const k of Object.keys(r)) if (typeof r[k] === typeof v[k]) r[k] = v[k];
  r.id = v.id;
  for (const k of ["division","request","method","area"]) if (r[k] && !OPT[k].includes(r[k])) r[k] = "";
  r.targets = OPT.targets.filter(t => Array.isArray(v.targets) && v.targets.includes(t));
  if (!["draft","ready","done","deleted"].includes(r.status)) r.status = "draft";
  for (const k of Object.keys(r)) if (typeof r[k] === "string") r[k] = r[k].slice(0,4000);
  return r;
}
function blankRecordShape(){ return {id:"",owner:"",status:"draft",interpreter:"",date:"",start:"",end:"",place:"",program:"",division:"",request:"",targets:[],method:"",area:"",client:"",content:"",result:"",pendingResult:false,deafNames:"",hearingNames:"",needsCorrection:false,created:"",updated:"",rev:""}; }
function missing(r){
  const m = [];
  if (!r.interpreter.trim()) m.push(["interpreter","수어통역사"]);
  if (!weekday(r.date)) m.push(["date","수어통역일"]);
  if (!timeInfo(r)) m.push(["start","시작·종료 시각"]);
  if (!r.place.trim()) m.push(["place","장소"]);
  if (!r.client.trim()) m.push(["client","의뢰인"]);
  if (!r.division) m.push(["division","분류"]);
  if (!r.request) m.push(["request","의뢰방법"]);
  if (!r.area) m.push(["area","통역영역"]);
  if (!r.targets.length) m.push(["targets","통역대상"]);
  if (!r.method) m.push(["method","통역방법"]);
  if (!r.content.trim()) m.push(["content","통역내용"]);
  if (!r.result.trim() && !r.pendingResult) m.push(["result","결과"]);
  return m;
}
function warnings(r){
  const w = [];
  if (r.place.length > LIMIT.place) w.push("장소가 "+LIMIT.place+"자를 넘습니다 (기존 시스템 제한)");
  if (r.result.length > LIMIT.result) w.push("결과가 "+LIMIT.result+"자를 넘습니다 (기존 시스템 제한)");
  if (r.interpreter.length > LIMIT.interpreter) w.push("통역사 이름이 너무 깁니다");
  if (r.pendingResult) w.push("결과 미확정");
  const t = timeInfo(r); if (t && t.overnight) w.push("다음 날 종료 (자정 넘김)");
  return w;
}

/* ---------- three-way merge (base = last copy both sides agreed on) ---------- */
const RANK = {draft:0,ready:1,done:2,deleted:3};
function merge3(base, mine, theirs){
  const merged = {...theirs}; const conflicts = [];
  for (const k of FIELDS) {
    const b = base ? base[k] : undefined, m = mine[k], t = theirs[k];
    if (same(m,t)) continue;
    if (base && same(t,b)) { merged[k] = clone(m); continue; }
    if (base && same(m,b)) continue;
    conflicts.push(k); merged[k] = clone(m);
  }
  const bs = base ? base.status : null;
  if (mine.status === "deleted" || theirs.status === "deleted") {
    if (mine.status === "deleted" && theirs.status === "deleted") merged.status = "deleted";
    else if (mine.status === "deleted" && (!base || FIELDS.every(k => same(theirs[k], base[k])))) merged.status = "deleted";
    else if (theirs.status === "deleted" && (!base || FIELDS.every(k => same(mine[k], base[k])))) merged.status = "deleted";
    else { merged.status = mine.status === "deleted" ? theirs.status : mine.status; if (!conflicts.includes("status")) conflicts.push("status"); }
  } else if (mine.status !== theirs.status) {
    if (bs === theirs.status) merged.status = mine.status;
    else if (bs === mine.status) merged.status = theirs.status;
    else merged.status = RANK[mine.status] > RANK[theirs.status] ? mine.status : theirs.status;
  }
  merged.needsCorrection = !!(theirs.needsCorrection || mine.needsCorrection);
  if (base && base.needsCorrection) merged.needsCorrection = !!(theirs.needsCorrection && mine.needsCorrection);
  if (merged.status === "done" && theirs.status === "done" && FIELDS.some(k => !same(merged[k], theirs[k]))) merged.needsCorrection = true;
  if (merged.status !== "done") merged.needsCorrection = false;
  merged.updated = mine.updated > theirs.updated ? mine.updated : theirs.updated;
  merged.rev = theirs.rev;
  return {merged, conflicts};
}

/* ---------- local store ---------- */
const S = {settings:{token:"", name:"", role:"", defaultMethod:true, defaultTargets:true}, items:[], lastSync:""};
let storageOk = true;
const isAdmin = () => S.settings.role === "admin";
function load(){
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (raw && typeof raw === "object") {
      const st = raw.settings || {};
      Object.assign(S.settings, {token: typeof st.token === "string" ? st.token : "", name: String(st.name || "").slice(0,20), role: st.role === "admin" ? "admin" : (st.role ? "interpreter" : ""),
        defaultMethod: st.defaultMethod !== false, defaultTargets: st.defaultTargets !== false});
      if (Array.isArray(raw.items)) S.items = raw.items.map(it => ({rec:normalize(it.rec), base:it.base ? normalize(it.base) : null, dirty:!!it.dirty, theirs: it.theirs ? normalize(it.theirs) : null, conflicts: Array.isArray(it.conflicts) ? it.conflicts.filter(f => FIELDS.includes(f) || f === "status") : []})).filter(it => it.rec);
      S.lastSync = typeof raw.lastSync === "string" ? raw.lastSync : "";
    }
  } catch { storageOk = false; }
}
function persist(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify({settings:S.settings, items:S.items, lastSync:S.lastSync})); storageOk = true; }
  catch { storageOk = false; }
  return storageOk;
}
const findItem = id => S.items.find(it => it.rec.id === id);
function visibleItems(){ return S.items.filter(it => it.rec.status !== "deleted"); }
/* Save edits: status follows completeness; edits after 입력 완료 flag a correction. */
function commit(item, changes){
  const before = item.rec;
  const next = {...before, ...changes};
  const dataChanged = FIELDS.some(k => !same(before[k], next[k]));
  if (!dataChanged && !("status" in changes) && !("needsCorrection" in changes)) return false;
  if (!("status" in changes) && next.status !== "done") next.status = missing(next).length ? "draft" : "ready";
  if (before.status === "done" && next.status === "done" && dataChanged) next.needsCorrection = true;
  next.updated = nowIso();
  item.rec = next; item.dirty = true;
  persist(); scheduleSync(1500);
  return true;
}

/* ---------- sync with the center Google Sheet ---------- */
let net = {ok:null, error:""};
let syncing = false, syncTimer = null, syncAgain = false;
async function api(body, timeout=25000){
  if (!SCRIPT_URL) throw new Error("config");
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(SCRIPT_URL, {method:"POST", body:JSON.stringify(body), redirect:"follow", signal:ctrl.signal});
    if (!res.ok) throw new Error("http " + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}
function scheduleSync(delay){ clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, delay); }
const signature = () => JSON.stringify(S.items.map(i => [i.rec.id, i.rec.rev, i.rec.status, i.rec.needsCorrection, i.dirty, !!i.theirs]));
function signedOut(message){
  S.settings.token = ""; persist();
  view.name = "join"; view.message = message; render(false);
}
async function syncNow(){
  if (!S.settings.token) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; syncAgain = false; renderSync("저장 중…");
  const before = signature();
  try {
    const sending = S.items.filter(it => it.dirty && !it.theirs).slice(0, 100).map(it => ({it, snap:clone(it.rec), baseRev: it.base ? it.base.rev : ""}));
    const known = {}; for (const it of S.items) if (it.base) known[it.rec.id] = it.base.rev;
    const res = await api({action:"sync", token:S.settings.token, changes:sending.map(x => ({rec:x.snap, baseRev:x.baseRev})), known});
    if (res.error === "auth") { signedOut("연결이 해제되었습니다. 관리자에게 새 링크를 받아 주세요."); return; }
    if (!res.ok) throw new Error(res.error || "server");
    if (res.me) { S.settings.name = res.me.name; S.settings.role = res.me.role; }
    let again = false;
    for (const {it, snap} of sending) {
      const r = (res.results || []).find(x => x.id === snap.id);
      if (!r) continue;
      if (r.ok) {
        const sent = normalize({...snap, rev:r.rev, owner: isAdmin() ? snap.owner : S.settings.name});
        it.base = sent;
        if (same({...it.rec, rev:""}, {...snap, rev:""})) { it.rec = clone(sent); it.dirty = false; } else it.rec.rev = r.rev;
        if (it.rec.status === "deleted" && !it.dirty) S.items = S.items.filter(x => x !== it);
      } else if (r.conflict) {
        const theirs = normalize(r.theirs);
        if (!theirs) { it.base = null; again = true; continue; }
        const {merged, conflicts} = merge3(it.base, it.rec, theirs);
        if (conflicts.length) { it.theirs = theirs; it.conflicts = conflicts; }
        else { it.rec = merged; it.base = theirs; again = true; }
      } else if (r.error) { it.error = r.error; }
    }
    for (const raw of res.updates || []) {
      const rec = normalize(raw); if (!rec) continue;
      const local = findItem(rec.id);
      if (local && (local.dirty || local.theirs || (local.base && local.base.rev === rec.rev))) continue;
      if (rec.status === "deleted") { if (local) S.items = S.items.filter(x => x !== local); continue; }
      if (local) { local.rec = clone(rec); local.base = rec; }
      else S.items.push({rec:clone(rec), base:rec, dirty:false, theirs:null, conflicts:[]});
    }
    S.lastSync = nowIso(); net = {ok:true, error:""};
    if (again) syncAgain = true;
  } catch (e) {
    net = {ok:false, error: e && e.message === "config" ? "config" : "offline"};
  } finally {
    syncing = false; persist(); renderSync();
    if (!["edit","settings","admin","join","install"].includes(view.name) && signature() !== before) render(false);
    if (syncAgain && net.ok) scheduleSync(300);
    else scheduleSync(net.ok ? 60000 : 30000);
  }
}
function pendingCount(){ return S.items.filter(it => it.dirty).length; }
function renderSync(text){
  const el = $("#sync"); if (!el) return;
  if (!S.settings.token) { el.textContent = ""; return; }
  if (text) { el.textContent = text; el.className = "sync"; return; }
  const p = pendingCount(), c = S.items.filter(it => it.theirs).length;
  let msg, warn = true;
  if (net.error === "config") msg = "설정 필요";
  else if (c) msg = "비교 필요 " + c + "건";
  else if (p && net.ok === false) msg = "보낼 기록 " + p + "건 · 연결되면 자동 전송";
  else if (p) msg = "저장 대기 " + p + "건";
  else if (net.ok === false) msg = "오프라인 · 기록 가능";
  else { msg = "모두 저장됨"; warn = false; }
  el.textContent = msg; el.className = "sync" + (warn ? " warn" : "");
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {} ta.remove(); return ok;
  }
}
function bindDetail(item){
  const r = item.rec;
  if (item.theirs) { bindConflict(item); return; }
  $("#edit").onclick = () => go("edit", r.id);

    const ok = await copyText(fillPayload(item.rec));

    commit(item, {status:"done", needsCorrection:false}); syncNow(); render(false); toast(fix ? "수정 완료로 표시했습니다." : "입력 완료로 표시했습니다.");
  });
  $("#reopen")?.addEventListener("click", () => {

  });
  $("#delete").onclick = () => {
    if (!confirm(item.rec.status === "done" ? "앱에서만 삭제합니다. 기존 통역일지의 등록 건은 그대로입니다. 삭제할까요?" : "이 기록을 삭제할까요?")) return;

  };
  document.querySelectorAll("[data-copyrow]").forEach(b => b.onclick = async () => {
    const row = b.closest("div").querySelector("dd").textContent;

  });
}
function conflictHTML(item){
  const mine = item.rec, theirs = item.theirs;
  const show = (k,v) => k === "targets" ? v.join(", ") : k === "pendingResult" ? (v ? "예" : "아니오") : k === "status" ? (STATUS[v] || "삭제됨") : v;

    '<form id="cf">'+item.conflicts.map(k => '<div class="diff"><b>'+esc(LABEL[k]||k)+'</b>'+
      '<label><input type="radio" name="'+k+'" value="mine" checked><span>이 기기 · '+esc(show(k,mine[k]) || "—")+'</span></label>'+
      '<label><input type="radio" name="'+k+'" value="theirs"><span>다른 기기 · '+esc(show(k,theirs[k]) || "—")+'</span></label></div>').join("")+
    '</form><div class="actions"><button type="button" class="primary" id="resolve">선택한 내용으로 저장</button><button type="button" id="back" class="ghost">나중에</button></div>';
}
function bindConflict(item){
  $("#back").onclick = () => go("list");
  $("#resolve").onclick = () => {
    const data = new FormData($("#cf"));
    const {merged} = merge3(item.base, item.rec, item.theirs);
    for (const k of item.conflicts) merged[k] = clone(data.get(k) === "theirs" ? item.theirs[k] : item.rec[k]);
    if (item.theirs.status === "done" && merged.status === "done" && FIELDS.some(k => !same(merged[k], item.theirs[k]))) merged.needsCorrection = true;
    item.rec = merged; item.base = item.theirs; item.theirs = null; item.conflicts = []; item.dirty = true;
    persist(); syncNow(); go("detail", merged.id); toast("선택한 내용으로 저장했습니다.");
  };
}

/* ---------- minimal QR encoder (byte mode, level M, versions 1-6) for the phone address ---------- */

  for (let i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if (x&256) x^=0x11d; } for (let i=255;i<512;i++) EXP[i]=EXP[i-255];
  const mul = (a,b) => a && b ? EXP[LOG[a]+LOG[b]] : 0;

    for (let i=0;i<n;i++){ const c = r[i]; if (c) for (let j=0;j<gen.length;j++) r[i+j]^=mul(gen[j],c); }

function drawQR(canvas, text){

  A.forEach((row,r) => row.forEach((v,c) => { if (v) ctx.fillRect(o+c*s, o+r*s, s, s); }));
}
